name: Publicar revision temporal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Preparar sitio estatico
        run: |
          mkdir -p _site
          cp index.html proyectos.html styles.css script.js proyectos.css proyectos.js _site/
          cp -R assets _site/assets

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
